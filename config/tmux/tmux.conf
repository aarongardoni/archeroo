# Using default ctrl + b prefix

# Set true color
set-option -sa terminal-overrides ",xterm*:Tc"

# Mouse
set -g mouse on

# --- NAVIGATION & WINDOWS ---

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Replicating your 'performable' ctrl+shift navigation
# (This works alongside vim-tmux-navigator)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# --- PLUGINS ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'

# --- THEME CONFIG ---
set -g @catppuccin_window_status_style "rounded"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# --- KEYBINDINGS ---

# Set vi-mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Split in current dir (matches your ctrl+b > shift+5 and shift+')
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# New Window (matches your ctrl+b > n)
bind n new-window -c "#{pane_current_path}"

# Toggle Zoom (matches your ctrl+b > z)
bind z resize-pane -Z

# Pipe screen into nvim (Your ctrl+b > v feature)
# This captures the visible pane and opens it in a temporary nvim buffer
bind v capture-pane -S - \; save-buffer /tmp/tmux-capture \; split-window -h "nvim /tmp/tmux-capture"

# --- INIT ---
run '~/.tmux/plugins/tpm/tpm'
